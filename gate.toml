# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-dialect-spec"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 14400

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/", "CLAUDE.md", "AGENTS.md"]

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
TMPDIR = "{wt}/scripts/.tmp"

# The checker's interpreter snapshots are keyed by source fingerprint and slow to rebuild.
[[check]]
name = "prepare"
argv = ["sh", "-c", "mkdir -p scripts/.tmp \"{root}/.tmp/isa-ref\" \"{root}/.tmp/gate-target\" && ln -s \"{root}/.tmp/isa-ref\" scripts/.isa-ref"]

[[check]]
name = "Python tooling tests"
argv = ["python3", "scripts/run_tests.py"]

[[check]]
name = "Python slow execution tests"
tier = "post-merge"  # long tail: main-health runs --tier full after landing
argv = ["python3", "scripts/run_tests.py", "--slow"]

[[check]]
name = "dialect gate"
tier = "post-merge"  # heavy: runs on main-health's cadence, not per push
argv = ["python3", "scripts/dialect_check_v02.py", "--json", "scripts/.tmp/pre-push-gate.json"]

[[check]]
name = "Tooling quality ratchet"
argv = ["python3", "scripts/quality.py"]

[siblings."bennett-isa-spec"]
sha = "c1d13200acb08af4922535f5a15a1ab872b78b41"
note = "clean interpreter of the dossier's 2902/2902 run"

[siblings."bennett-conformance"]
sha = "b077ae2a22e73b2321dcfe2fccede885f47b8d89"

[siblings."bennett-driver"]
sha = "c92bf23fbeda262c2b6ebc6842d0dff93f435c14"

[siblings."bennett"]
sha = "75ba4d9195bad784b81394ca2a6b428109c742e2"
